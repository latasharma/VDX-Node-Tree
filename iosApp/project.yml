# UNVERIFIED: written without Xcode. Generate the project with XcodeGen:
#   brew install xcodegen && cd iosApp && xcodegen && open NodeTree.xcodeproj
# The pre-build script compiles the shared Kotlin core into NodeTreeShared.framework.
name: NodeTree
options:
  bundleIdPrefix: app.nodetree
  deploymentTarget:
    iOS: "16.0"
targets:
  NodeTree:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Node Tree
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["-framework", "NodeTreeShared"]
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
